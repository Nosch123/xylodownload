<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYLO Executor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #0f0f0f;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px;
            border-bottom: 2px solid #ff0000;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
        }
        
        .logo-img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }
        
        .logo-text {
            color: #ff0000;
            font-size: 28px;
            font-weight: bold;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .download-container {
            text-align: center;
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #333;
            max-width: 500px;
            width: 100%;
        }
        
        .download-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .download-btn:hover {
            background-color: #cc0000;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }
        
        .download-btn:disabled {
            background-color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .access-denied {
            color: #ff0000;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
        
        .footer {
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <!-- Ersetze "logo.png" mit dem tatsächlichen Pfad zu deinem Logo -->
            <img src="xylo_fox_logo-removebg-preview.ico" alt="XYLO Logo" class="logo-img">
            <div class="logo-text">XYLO</div>
        </div>
    </div>

    <div class="main-content">
        <div class="download-container">
            <h2 class="download-title">XYLO Executor</h2>
            <p>Click the button below to download XYLO</p>
            <button id="downloadBtn" class="download-btn">Download XYLO</button>
            <p class="access-denied" id="accessDenied">Access Denied - Please try again and do the linkvertise steps</p>
        </div>
    </div>

    <div class="footer">
        API: Xeno
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const downloadBtn = document.getElementById('downloadBtn');
            const accessDenied = document.getElementById('accessDenied');
            
            // Prüfen, ob der Nutzer von linkvertise.com kommt
            function checkReferrer() {
                const referrer = document.referrer;
                return referrer.includes('linkvertise.com');
            }
            
            downloadBtn.addEventListener('click', function() {
                if (checkReferrer()) {
                    // Erstelle einen temporären Link für den Download
                    const link = document.createElement('a');
                    link.href = 'xylo.zip'; // Ersetze mit dem tatsächlichen Dateipfad
                    link.download = 'xylo.zip';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } else {
                    accessDenied.style.display = 'block';
                    downloadBtn.disabled = true;
                    downloadBtn.textContent = 'Download not possible';
                    
                    // Nach 5 Sekunden zurücksetzen
                    setTimeout(function() {
                        accessDenied.style.display = 'none';
                        downloadBtn.disabled = false;
                        downloadBtn.textContent = 'Download XYLO';
                    }, 5000);
                }
            });
        });
    </script>
</body>
</html>
